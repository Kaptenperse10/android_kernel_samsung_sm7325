name: Build A52s Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      DEFCONFIG: vendor/a52sxq_eur_open_defconfig
      AK3_REPO: https://github.com/osm0sis/AnyKernel3.git
      AK3_BRANCH: master

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
         
      - name: Download Android clang
        run: |
           git clone --depth=1 --branch main-kernel https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 prebuilts-clang
           echo "$PWD/prebuilts-clang/clang-r416183b1/bin" >> $GITHUB_PATH
         
      - name: Install dependencies
        run: |
         sudo apt-get update
         sudo apt-get install -y bc bison build-essential ccache clang curl flex gawk gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git libelf-dev libncurses-dev libssl-dev lld llvm lz4 pahole python-is-python3 python3 rsync unzip zip zstd

      - name: Show repo info
        run: |
          pwd
          ls
          ls arch/arm64/configs/vendor/
   
      - name: Fix script permissions
        run: |
          chmod +x scripts/gcc-wrapper.py || true
          chmod +x scripts/gcc-version.sh || true
          chmod +x scripts/clang-version.sh || true
          chmod +x scripts/gcc-plugin.sh || true
    
      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=github
          export KBUILD_BUILD_HOST=actions
          export CC=clang
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1

          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KCFLAGS="-Wno-error=compare-distinct-pointer-types -Wno-error=align-mismatch"
          export KBUILD_CFLAGS="-Wno-error=compare-distinct-pointer-types -Wno-error=align-mismatch"

          clang --version
          ld.lld --version

          make O=out $DEFCONFIG
          make O=out -j"$(nproc)"

      - name: Debug output tree
        run: |
            find out/arch/arm64/boot -maxdepth 3 -type f | sort || true
   
      - name: Find built kernel image
        run: |
           mkdir -p release

           cp out/arch/arm64/boot/Image release/Image
           cp out/arch/arm64/boot/dtbo.img release/dtbo.img || true

           echo "KERNEL_IMAGE=Image" >> "$GITHUB_ENV"

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 --branch "$AK3_BRANCH" "$AK3_REPO" AnyKernel3

      - name: Prepare flashable zip
        run: |
           cp release/Image AnyKernel3/Image
           if [ -f release/dtbo.img ]; then
           cp release/dtbo.img AnyKernel3/dtbo.img
           fi

           cd AnyKernel3
           rm -rf .git .github README.md
           ZIP_NAME="A52s-Kernel-${GITHUB_RUN_ID}.zip"
           zip -r9 "../$ZIP_NAME" ./*
           cd ..
           mkdir -p artifacts
           mv "$ZIP_NAME" artifacts/

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: a52s-kernel-${{ github.run_id }}
          path: artifacts/*.zip
          if-no-files-found: error
          overwrite: true
